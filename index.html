    tex: {
      inlineMath: [['\\(','\\)']],
      displayMath: [['\\[','\\]']],
      packages: {'[+]':['noerrors']}

</script>

<style>
  :root{
    --bg:#0e1424; --panel:#111827; --ink:#e5e7eb; --muted:#9aa6b2;
    --ring:#334155; --accent:#60a5fa; --ok:#34d399; --bad:#ef4444;
    --field:#1f2a3a;
  }
  *{box-sizing:border-box}
  html,body{height:100%;direction:rtl}
  body{
    margin:0;background:var(--bg);color:var(--ink);
    font-family:'Segoe UI','Tahoma','Arial','David','FrankRuehl',serif;text-align:right;
  }
  .wrap{max-width:1200px;margin:0 auto;padding:22px}
  h1{font-size:1.35rem;margin:0 0 16px}

  /* Tabs */
  .tabs{display:flex; gap:6px; margin-bottom:12px; flex-wrap:wrap}
  .tab-btn{
    cursor:pointer; padding:8px 12px; border:1px solid var(--ring);
    background:var(--field); color:var(--ink); border-radius:10px; font-size:.95rem;
  }
  .tab-btn[aria-selected="true"]{border-color:var(--accent)}
  .tab-panel{display:none}
  .tab-panel.active{display:block}

  .grid{display:grid;grid-template-columns:1fr 1.2fr;gap:16px}
  @media (max-width:920px){.grid{grid-template-columns:1fr}}

  .card{background:var(--panel);border:1px solid var(--ring);border-radius:14px;padding:14px 16px}
  .section-title{font-size:1.05rem;margin:0 0 10px;color:var(--ink)}

  label{font-size:.92rem;color:var(--muted);display:block}
  textarea{
    width:100%;background:var(--field);color:var(--ink);
    border:1px solid var(--ring);border-radius:12px;
    padding:10px 12px;font-size:1rem;line-height:1.5;outline:none;
    direction:ltr;text-align:left;font-family:monospace;
  }
  textarea:focus{border-color:var(--accent)}

  .controls{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:8px;justify-content:flex-start}
  .pill{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--ring);background:var(--field);padding:6px 10px;border-radius:999px;font-size:.9rem}
  .btn{cursor:pointer;background:var(--field);border:1px solid var(--ring);color:var(--ink);padding:8px 12px;border-radius:10px}
  .btn:hover{border-color:var(--accent)}

  .status{font-size:.9rem;margin-top:6px;text-align:right}
  .status.ok{color:var(--ok)} .status.bad{color:var(--bad)}

  .render{
    background:#0b1020;border:1px dashed #243047;border-radius:12px;
    padding:14px 16px;min-height:96px;overflow:auto;direction:ltr;text-align:center;
  }
  .hint{color:var(--muted);font-size:.95rem;margin-top:8px;line-height:1.9}
  .monospace{font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,"Courier New",monospace}
  select{background:var(--field);color:var(--ink);border:1px solid var(--ring);border-radius:10px;padding:6px 8px}
</style>
<style>
  /* Equation Toolbar Styling */
  .eqtb-wrap{ margin:8px 0 }
  .eqtb{
    display:flex; flex-wrap:wrap; gap:.4rem; align-items:center;
    background:#0b1020; border:1px solid #243047; border-radius:10px; padding:.5rem;
  }
  .eqtb button, .eqtb select{
    font:inherit; line-height:1; padding:.42rem .6rem;
    border:1px solid var(--ring); background:var(--field); color:var(--ink);
    border-radius:.5rem; cursor:pointer;
  }
  .eqtb button:hover{ border-color:var(--accent) }
  .eqtb .sep{ width:1px; height:1.4rem; background:#243047; margin:0 .2rem }
</style>

</head>

    <h1>תרגיל</h1>

    <!-- Tabs header -->
    <div class="tabs" role="tablist" aria-label="ניווט לשוניות">

<label for="inputRaw">קלט Plain או LaTeX</label>

<!-- עורך המשוואות -->

<textarea id="inputRaw" rows="6"
placeholder="דוגמה לכתיבה בLaTeX:
y = C_1 \sin(x) + C_2 \cos(x)
או במצב Plain:
y = C_1*sin(x) + C_2*cos(x)"></textarea>

          
          <div class="controls">

            <button class="btn" id="btnClear">ניקוי</button>

		    • ביטוי מורכב יש לשים בתוך { }<br/>

			• הטקסט הקיים במסך אינו פתרון התרגיל אלא דוגמה לכתיבת משוואה ב-LaTeX<br/>
            • יש להשתמש אך ורק בקבועים מהצורה: C_1, C_2, C_3 … עבור הפתרון ההומוגני<br/>
          </div>

        <div class="section-title">רמז 1</div>

      </div>
    </section>

    <!-- Panel: רמז 2 -->
    <section class="tab-panel" id="tab-h2" role="tabpanel" aria-labelledby="tabbtn-h2">
      <div class="card">
        <div class="section-title">רמז 2</div>

        <div class="hint" id="solutionSteps" style="margin-top:10px"></div>
      </div>

<script>
'use strict';

/* ============================================================================
   EXERCISE CONFIGURATION
   ============================================================================ */
const EXERCISE_CONFIG = [
  {
    id: 'ode_second_order_variation_params_01',
    title: 'מסדר שני — וריאציית פרמטרים',
    
    // Exercise content placeholders
    latexProblem: String.raw``,
    exampleInput: String.raw``,
    hint1Html: ``,
    hint2Html: ``,
    solutionDisplayLatex: String.raw``,
    solutionStepsHtml: ``,
    
    // Checking configuration
    check: {
      type: 'variation_parameters_form',
      homogeneousTerms: ['cos(x)', 'sin(x)'],
      particularTerm: 'exp(x)',
      particularCoeff: 0.5
    }
  }
];

/* ============================================================================
   CORE MATHEMATICAL PROCESSING ENGINE
   ============================================================================ */
class MathExpressionProcessor {
  
  /**
   * Convert LaTeX syntax to plain mathematical notation
   * Preserves ^ notation for mathjs compatibility
   */
  static latexToPlain(input) {
    if (!input || typeof input !== 'string') return '';
    
    let expr = input.trim();
    
    // Remove equation prefix
    expr = expr.replace(/^[yY]\s*=\s*/, '');
    
    // LaTeX function conversions
    const latexReplacements = [
      [/\\sin/g, 'sin'],
      [/\\cos/g, 'cos'],
      [/\\tan/g, 'tan'],
      [/\\exp/g, 'exp'],
      [/\\ln/g, 'log'],
      [/\\log/g, 'log'],
      [/\\sqrt\s*\{([^{}]+)\}/g, 'sqrt($1)'],
      [/\\frac\s*\{([^{}]+)\}\s*\{([^{}]+)\}/g, '($1)/($2)'],
      [/\\left|\\right/g, ''],
      [/\\cdot|\\times/g, '*'],
      [/\\pi/g, 'pi'],
      [/\{/g, '*('],
      [/\}/g, ')']
    ];
    
    latexReplacements.forEach(([pattern, replacement]) => {
      expr = expr.replace(pattern, replacement);
    });
    
    // Clean up spacing and subscripts
    expr = expr.replace(/\s+/g, '')
               .replace(/C_(\d+)/g, 'C_$1');
    
    // Add implicit multiplication for common patterns
    expr = expr.replace(/(\d+)\(/g, '$1*(');  // 2(x) -> 2*(x)
    expr = expr.replace(/(\d+)([a-zA-Z])/g, '$1*$2');  // 2x -> 2*x
    expr = expr.replace(/\)([a-zA-Z])/g, ')*$1');  // )x -> )*x
    expr = expr.replace(/\)(\d)/g, ')*$1');  // )2 -> )*2
    
    return expr;
  }
  
  /**
   * Merge power expressions for variables (e.g., x*x -> x^2)
   * Works with ^ notation before conversion to **
   */
  static mergePowerExpressions(expr) {
    if (!expr || typeof expr !== 'string') return expr;
    
    // x * x^n  →  x^(n+1)
    expr = expr.replace(
      /\b([xX])\s*\*\s*\1\s*\^\s*(?:\{(\d+)\}|(\d+))/g,
      (match, variable, bracedExp, bareExp) => {
        const exponent = parseInt(bracedExp || bareExp);
        return `${variable}^${exponent + 1}`;
      }
    );
    
    // x^n * x  →  x^(n+1)
    expr = expr.replace(
      /\b([xX])\s*\^\s*(?:\{(\d+)\}|(\d+))\s*\*\s*\1\b/g,
      (match, variable, bracedExp, bareExp) => {
        const exponent = parseInt(bracedExp || bareExp);
        return `${variable}^${exponent + 1}`;
      }
    );
    
    // x * x  →  x^2
    expr = expr.replace(/\b([xX])\s*\*\s*\1\b/g, '$1^2');
    
    return expr;
  }
  
  /**
   * Compile mathematical expression to JavaScript function
   * Converts ^ to ** for JavaScript compatibility
   */
  static compileToFunction(expr) {
    try {
      // Convert to JavaScript operators
      const jsExpr = expr
        .replace(/\^/g, '**')
        .replace(/(\d)([a-zA-Z])/g, '$1*$2') // implicit multiplication: 2x -> 2*x
        .replace(/([a-zA-Z])(\d)/g, '$1*$2'); // implicit multiplication: x2 -> x*2
      
      // Create safe function with mathematical constants
      const mathFunction = new Function(
        'x', 'y', 'sin', 'cos', 'tan', 'exp', 'log', 'sqrt', 'pi', 'e', 
        'C_1', 'C_2', 'C_3', 'C_4',
        `"use strict"; 
         try { 
           const result = (${jsExpr}); 
           return Number.isFinite(result) ? result : NaN; 
         } catch(error) { 
           return NaN; 
         }`
      );
      
      // Test function with sample values
      mathFunction(0, 0, Math.sin, Math.cos, Math.tan, Math.exp, Math.log, Math.sqrt, Math.PI, Math.E, 1, 1, 1, 1);
      
      return mathFunction;
    } catch (error) {
      throw new Error(`Cannot compile expression: ${error.message}`);
    }
  }
  
  /**
   * Convert mathematical expression to LaTeX using mathjs
   */
  static toLatex(expr) {
    try {
      const node = math.parse(expr);
      let latex = node.toTex({ parenthesis: 'keep', implicit: 'show' });
      
      // Fix subscript formatting
      latex = latex.replace(/C\\_(\d+)/g, 'C_{$1}');
      
      return latex;
    } catch (error) {
      // Fallback to original expression if conversion fails
      return expr;
    }
  }
  
  /**
   * Process user input from raw text to displayable LaTeX
   */
  static process(rawInput) {
    const plainExpr = this.latexToPlain(rawInput);
    const mergedExpr = this.mergePowerExpressions(plainExpr);
    const mathFunction = this.compileToFunction(mergedExpr);
    const latexOutput = this.toLatex(mergedExpr);
    
    return {
      plain: mergedExpr,
      latex: latexOutput,
      function: mathFunction
    };
  }
}

/* ============================================================================
   ANSWER VALIDATION ENGINE
   ============================================================================ */
class AnswerValidator {
  
  /**
   * Validate variation of parameters solution format
   */
  static validateVariationParameters(userInput) {
    if (!userInput || !userInput.trim()) return false;
    
    try {
      const plainExpr = MathExpressionProcessor.latexToPlain(userInput)
        .toLowerCase()
        .replace(/\s+/g, '');
      
      // Check for required components
      const patterns = {
        hasC1Cos: /c[_]?1.*cos\(x\)|cos\(x\).*c[_]?1/i,
        hasC2Sin: /c[_]?2.*sin\(x\)|sin\(x\).*c[_]?2/i,
        hasHalfExp: /(0\.5|0,5|\(1\/2\)|\(0\.5\)).*exp\(x\)|exp\(x\).*(0\.5|0,5|\(1\/2\)|\(0\.5\))/i,
        hasNegativeExp: /-.*exp\(x\)/i
      };
      
      const results = {};
      for (const [key, pattern] of Object.entries(patterns)) {
        results[key] = pattern.test(plainExpr);
      }
      
      // Reject if negative exponential coefficient
      if (results.hasNegativeExp) {
        console.log('Validation failed: negative exponential coefficient');
        return false;
      }
      
      // Require all positive components
      const isValid = results.hasC1Cos && results.hasC2Sin && results.hasHalfExp;
      
      console.log('Validation results:', { plainExpr, ...results, isValid });
      return isValid;
      
    } catch (error) {
      console.error('Validation error:', error);
      return false;
    }
  }
}

/* ============================================================================
   UI MANAGEMENT
   ============================================================================ */
class ExerciseUI {
  constructor() {
    this.elements = this.getElements();
    this.currentExercise = null;
    this.debounceTimer = null;
    
    this.initializeEventListeners();
    this.initializeEquationToolbar();
  }
  
  getElements() {
    const elements = {};
    const ids = [
      'inputRaw', 'forceLatex', 'btnClear', 'btnCheck', 
      'status', 'render', 'checkMsg', 'problemRender', 
      'solutionBox', 'solutionSteps', 'hint1Box', 'hint2Box'
    ];
    
    ids.forEach(id => {
      elements[id] = document.getElementById(id);
      if (!elements[id]) {
        console.warn(`Element with id '${id}' not found`);
      }
    });
    
    return elements;
  }
  
  initializeEventListeners() {
    // Input processing with debouncing
    this.elements.inputRaw?.addEventListener('input', () => {
      this.debounce(() => this.processInput(), 120);
    });
    
    this.elements.forceLatex?.addEventListener('change', () => {
      this.processInput();
    });
    
    // Control buttons
    this.elements.btnClear?.addEventListener('click', () => {
      this.clearInput();
    });
    
    this.elements.btnCheck?.addEventListener('click', () => {
      this.checkAnswer();
    });
  }
  
  debounce(func, delay) {
    clearTimeout(this.debounceTimer);
    this.debounceTimer = setTimeout(func, delay);
  }
  
  setStatus(message, type = '') {
    if (!this.elements.status) return;
    
    this.elements.status.className = `status ${type}`;
    this.elements.status.textContent = message + (type === 'ok' ? '  @ open university' : '');
  }
  
  async processInput() {
    const rawInput = this.elements.inputRaw?.value || '';
    const sanitizedInput = rawInput.replace(/[\u200E\u200F\u202A-\u202E\u2066-\u2069]/g, '').trim();
    
    if (!sanitizedInput) {
      this.elements.render.innerHTML = '';
      this.setStatus('');
      return;
    }
    
    const isLatexMode = this.elements.forceLatex?.checked || this.looksLikeLatex(sanitizedInput);
    
    try {
      if (isLatexMode) {
        await this.renderLatex(sanitizedInput);
        this.setStatus('מעובד במצב LaTeX', 'ok');
      } else {
        const result = MathExpressionProcessor.process(sanitizedInput);
        await this.renderLatex(result.latex);
        this.setStatus(`מעובד: ${result.plain}`, 'ok');
      }
    } catch (error) {
      console.error('Processing error:', error);
      this.elements.render.innerHTML = 
        `<div class="monospace">שגיאה בעיבוד: ${error.message}\n\nקלט מקורי: ${sanitizedInput}</div>`;
      this.setStatus('שגיאה בעיבוד — בדוק תחביר', 'bad');
    }
  }
  
  looksLikeLatex(input) {
    return /\\[a-zA-Z]+|\\\[|\\\]|\\\(|\\\)|\$(?!\s*$)|\\int|\\sum|\\frac|\\sqrt|\\sin|\\cos|\\exp|\\cdot/.test(input);
  }
  
  async renderLatex(latexContent) {
    if (!this.elements.render) return;
    
    this.elements.render.innerHTML = `\\[ ${latexContent} \\]`;
    
    if (window.MathJax?.typesetPromise) {
      try {
        await MathJax.typesetPromise([this.elements.render]);
      } catch (error) {
        this.elements.render.innerHTML = `<div class="monospace">${latexContent}</div>`;
      }
    }
  }
  
  clearInput() {
    if (this.elements.inputRaw) {
      this.elements.inputRaw.value = '';
      this.elements.inputRaw.focus();
    }
    if (this.elements.render) {
      this.elements.render.innerHTML = '';
    }
    if (this.elements.checkMsg) {
      this.elements.checkMsg.textContent = '';
    }
    this.setStatus('');
  }
  
  checkAnswer() {
    const rawInput = this.elements.inputRaw?.value || '';
    const isLatexForced = this.elements.forceLatex?.checked;
    
    if (!this.elements.checkMsg) return;
    
    if (isLatexForced) {
      this.elements.checkMsg.className = 'status bad';
      this.elements.checkMsg.textContent = 'בדיקת נכונות לא פועלת במצב LaTeX מוכרח - בטלו הסימון לבדיקה';
    } else {
      try {
        const isCorrect = AnswerValidator.validateVariationParameters(rawInput);
        this.elements.checkMsg.className = `status ${isCorrect ? 'ok' : 'bad'}`;
        this.elements.checkMsg.textContent = isCorrect ? 'תשובה נכונה' : 'תשובה לא נכונה';
      } catch (error) {
        console.error('Check error:', error);
        this.elements.checkMsg.className = 'status bad';
        this.elements.checkMsg.textContent = 'שגיאה בבדיקת התשובה';
      }
    }
  }
  
  async loadExercise(exerciseIndex = 0) {
    const exercise = EXERCISE_CONFIG[exerciseIndex];
    if (!exercise) {
      console.error(`Exercise at index ${exerciseIndex} not found`);
      return;
    }
    
    this.currentExercise = exercise;
    
    // Load content into UI elements
    const contentMappings = [
      ['problemRender', exercise.latexProblem],
      ['solutionBox', exercise.solutionDisplayLatex],
      ['solutionSteps', exercise.solutionStepsHtml],
      ['hint1Box', exercise.hint1Html],
      ['hint2Box', exercise.hint2Html]
    ];
    
    for (const [elementId, content] of contentMappings) {
      if (this.elements[elementId]) {
        if (elementId.includes('Render') || elementId === 'solutionBox') {
          await this.renderLatexToElement(elementId, content);
        } else {
          this.setElementHtml(elementId, content);
        }
      }
    }
    
    // Set example input
    if (this.elements.inputRaw) {
      this.elements.inputRaw.value = exercise.exampleInput || '';
      this.processInput();
    }
  }
  
  async renderLatexToElement(elementId, latexContent) {
    const element = this.elements[elementId];
    if (!element) return;
    
    element.innerHTML = `\\[ ${latexContent} \\]`;
    
    if (window.MathJax?.typesetPromise) {
      try {
        await MathJax.typesetPromise([element]);
      } catch (error) {
        element.innerHTML = `<div class="monospace">${latexContent}</div>`;
      }
    }
  }
  
  setElementHtml(elementId, htmlContent) {
    const element = this.elements[elementId];
    if (!element) return;
    
    element.innerHTML = htmlContent;
    
    if (window.MathJax?.typesetPromise) {
      MathJax.typesetPromise([element]);
    }
  }
  
  initializeEquationToolbar() {
    const input = this.elements.inputRaw;
    const mount = document.getElementById('eqToolbar');
    
    if (!input || !mount || mount.dataset.initialized) return;
    
    mount.dataset.initialized = 'true';
    
    const toolbar = document.createElement('div');
    toolbar.className = 'eqtb';
    
    const toolbarItems = [
      { label: 'C_1', title: 'קבוע C_1', insert: ['C_1', ''] },
      { label: 'C_2', title: 'קבוע C_2', insert: ['C_2', ''] },
      { label: 'sin', title: '\\sin( )', insert: ['\\sin(', ')'] },
      { label: 'cos', title: '\\cos( )', insert: ['\\cos(', ')'] },
      { label: 'frac', title: '\\frac{ }{ }', insert: ['\\frac{', '}{}'] },
      { label: '√', title: '\\sqrt{ }', insert: ['\\sqrt{', '}'] },
      { label: 'e^x', title: 'e^{x}', insert: ['e^', 'x'] },
      { label: 'x^2', title: 'x^{2}', insert: ['x^', '2'] },
      { label: '∫', title: '\\int', insert: ['\\int ', ''] },
      { label: '( )', title: 'סוגריים עגולים', insert: ['(', ')'] },
      { label: '{ }', title: 'סוגריים מסולסלים', insert: ['{', '}'] }
    ];
    
    toolbarItems.forEach(item => {
      const button = document.createElement('button');
      button.type = 'button';
      button.textContent = item.label;
      button.title = item.title;
      button.addEventListener('click', () => {
        this.insertAtCaret(input, item.insert[0], item.insert[1]);
      });
      toolbar.appendChild(button);
    });
    
    mount.appendChild(toolbar);
  }
  
  insertAtCaret(element, before, after) {
    element.focus();
    
    const start = element.selectionStart ?? element.value.length;
    const end = element.selectionEnd ?? element.value.length;
    const selectedText = element.value.slice(start, end);
    const insertText = before + (selectedText || '') + (after || '');
    
    element.value = element.value.slice(0, start) + insertText + element.value.slice(end);
    
    const newPosition = selectedText ? start + before.length + selectedText.length : start + before.length;
    element.setSelectionRange(newPosition, newPosition);
    
    // Trigger input event to update display
    element.dispatchEvent(new Event('input', { bubbles: true }));
    element.dispatchEvent(new Event('change', { bubbles: true }));
  }
}

/* ============================================================================
   TAB SYSTEM
   ============================================================================ */
class TabSystem {
  static initialize() {
    const tabButtons = [...document.querySelectorAll('.tab-btn')];
    const tabPanels = [...document.querySelectorAll('.tab-panel')];
    
    function activateTab(targetId) {
      // Update button states
      tabButtons.forEach(button => {
        const isActive = button.getAttribute('aria-controls') === targetId;
        button.setAttribute('aria-selected', isActive.toString());
      });
      
      // Update panel visibility
      tabPanels.forEach(panel => {
        panel.classList.toggle('active', panel.id === targetId);
      });
      
      // Re-render MathJax for activated panels
      if (window.MathJax?.typesetPromise) {
        const activePanels = tabPanels.filter(panel => panel.id === targetId);
        MathJax.typesetPromise(activePanels);
      }
    }
    
    // Attach click handlers
    tabButtons.forEach(button => {
      button.addEventListener('click', () => {
        const targetId = button.getAttribute('aria-controls');
        if (targetId) activateTab(targetId);
      });
    });
  }
}

/* ============================================================================
   APPLICATION INITIALIZATION
   ============================================================================ */
function initializeApplication() {
  // Prevent multiple initializations
  if (window.__EXERCISE_APP_INITIALIZED__) return;
  window.__EXERCISE_APP_INITIALIZED__ = true;
  
  // Wait for required libraries
  function waitForLibraries(callback) {
    let attempts = 0;
    const maxAttempts = 100;
    
    function checkLibraries() {
      if (typeof math !== 'undefined' && window.MathJax) {
        callback();
      } else if (attempts++ < maxAttempts) {
        setTimeout(checkLibraries, 50);
      } else {
        console.error('Required libraries failed to load');
      }
    }
    
    checkLibraries();
  }
  
  waitForLibraries(() => {
    // Initialize components
    TabSystem.initialize();
    const ui = new ExerciseUI();
    
    // Load first exercise
    ui.loadExercise(0);
    
    console.log('Exercise application initialized successfully');
  });
}

// Initialize when DOM is ready
if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', initializeApplication);
} else {
  initializeApplication();
}
